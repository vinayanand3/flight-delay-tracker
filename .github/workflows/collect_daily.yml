name: Daily Flight Delay Collection
on:
  schedule:
    # Fixed UTC: 01:17 UTC is 21:17 EDT / 20:17 EST on the previous local day.
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flight-data-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Validate collector
        run: python -m unittest discover -s tests
      - name: Collect within the free request budget
        id: collection
        continue-on-error: true
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
        run: python scripts/collect_flights.py
      - name: Rebuild the dashboard dataset
        run: python scripts/build_dashboard.py
      - name: Preserve data and request accounting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/
          if ! git diff --staged --quiet; then
            git commit -m "Update daily flight sample and collection health"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report collection failure
        if: steps.collection.outcome == 'failure'
        run: |
          echo '::error::Collection failed. Previous flight data was preserved; inspect the sanitized collection output.'
          exit 1
